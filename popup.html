<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis-Shift Handler</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #c1f0d2, #a6d5f7);
      margin: 0;
      padding: 0;
      width: 400px;
      min-height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      padding: 20px;
      text-align: center;
      box-sizing: border-box;
    }

    h1 {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #333;
    }

    textarea {
      width: 100%;
      min-height: 80px;
      border-radius: 15px;
      border: 2px solid #ccc;
      padding: 10px;
      font-size: 14px;
      resize: none;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      #outputText {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f9f9f9;
    /* Add RTL support */
    unicode-bidi: bidi-override;
    }

    /* Ensure proper RTL rendering */
    .rtl-text {
        direction: rtl;
        text-align: right;
        unicode-bidi: embed;
    }
    }

    .switch-section {
      margin: 20px 0;
      font-size: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      color: #333;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      border-radius: 24px;
      transition: 0.4s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      border-radius: 50%;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.4s;
    }
    .button-row {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    }

    .button-row button {
        flex: 1;
        margin-top: 0;
        font-size: 13px;
        padding: 8px 5px;
    }

    #helpBtn {
        background: #10b981;
    }

    #helpBtn:hover {
        background: #059669;
    }

    input:checked + .slider {
      background-color: #0077b6;
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }

    h2 {
      font-size: 18px;
      font-weight: bold;
      margin: 15px 0 10px 0;
      color: #333;
    }

    button {
      margin-top: 15px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.3s ease;
      width: 100%;
    }

    button:hover {
      background: #2563eb;
    }

    #outputText {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
    }

    .direction-indicator {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Mis-Shift Handler</h1>
    
    <textarea id="inputText" placeholder="Enter The Misspelled Text Here..."></textarea>
    
    <div class="switch-section">
      <span>Arabic To English</span>
      <label class="switch">
        <input type="checkbox" id="directionSwitch">
        <span class="slider"></span>
      </label>
      <span>English To Arabic</span>
    </div>
    
    <h2>Corrected Form</h2>
    <textarea id="outputText" placeholder="Corrected Text Will Appear Here..." readonly></textarea>
    <div class="direction-indicator" id="directionIndicator">Direction: English → Arabic</div>
    
    <div class="button-row">
        <button id="copyBtn">Copy Results</button>
        <button id="pasteBtn">Paste</button>
    </div>
    <div class="button-row">
        <button id="clearBtn">Clear All</button>
        <button id="helpBtn">Help</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
